name: CI

# lint → (test | package → verify) → publish
#
# Everything that needs a bench runs on the SNE image the Vyogo pools run: one container
# with MariaDB, Redis, workers and a ready site. `test` mounts this checkout into that bench
# and runs the app's suite; `package` builds the FPM package (compiled desk bundles,
# vendored Python dependencies for amd64 and arm64); `verify` installs that package into a
# fresh SNE bench with `fpm install`, exactly as a pool would. Only a package that passed
# both is published, to two registries: the Vyogo FPM registry (https://fpm.vyogo.tech)
# and, as an OCI artifact, the FPM registry on GHCR.
#
#   any branch     lint, test, package, verify
#   push to main   + publish  vyogotech/frappe_ai==X.Y.Z-git.<date>.<sha>   (a prerelease, never `latest`)
#   tag v<X.Y.Z>   + publish  vyogotech/frappe_ai==X.Y.Z                     (must equal frappe_ai.__version__)
#   dispatch       as the ref, with `publish` and `version` overridable
#
# Install from either registry:
#   fpm repo add vyogo https://fpm.vyogo.tech --username <user>
#   fpm repo add ghcr ghcr.io/vyogotech/fpm --type oci
#   fpm install vyogotech/frappe_ai --bench-path <bench> --site <site>

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the registry even from a branch.
        type: boolean
        default: false
      version:
        description: Version to package. Default is derived from the ref.
        type: string
        default: ''

# GITHUB_TOKEN is the pipeline's own credential for GHCR: `packages: write` lets it push
# to ghcr.io/<org>/..., with no PAT to provision. The Vyogo FPM registry takes the
# FPM_REGISTRY_USERNAME and FPM_REGISTRY_PASSWORD secrets, with its URL in the
# FPM_REGISTRY_URL variable (the same names the fpm mirror workflow uses).
permissions:
  contents: read
  packages: write

concurrency:
  # A newer commit cancels an older branch run; a publishing run (main, tags) is left to finish.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && github.ref_name != 'main' }}

env:
  FPM_VERSION: v4.6.0
  SNE_IMAGE: docker.io/vyogo/erpnext:sne-version-16
  # The frappe whose esbuild compiles this app's desk bundles. Must match the bench line
  # the package targets; the Vyogo Cloud pools and the SNE image are v16.
  FRAPPE_REF: version-16
  # Python of the destination bench. Frappe v16 (16.18+) runs on 3.14.
  BENCH_PYTHON: '3.14'
  # Where the package goes. Both are the registries `fpm mirror` fills with frappe and
  # erpnext: the Vyogo FPM registry over HTTP, and its OCI twin on GHCR.
  FPM_HTTP_REGISTRY: ${{ vars.FPM_REGISTRY_URL || 'https://fpm.vyogo.tech' }}
  FPM_OCI_REPOSITORY: ${{ vars.FPM_OCI_REPOSITORY || 'ghcr.io/vyogotech/fpm' }}
  ORG: vyogotech
  APP: frappe_ai

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Tier 1 — static checks. ~1–2 min. Linters and type-checkers against the
  # working tree; no bench.
  # ──────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Frappe v16 (16.18+) requires Python 3.14.
          python-version: '3.14'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Frappe v16 frontend declares engines.node >= 24.
          node-version: '24'
          cache: 'npm'

      - name: Install uv
        # v8 doesn't ship a major-version tag yet (only v8.0.0 / v8.1.0),
        # and v7 is the latest rolling major tag. Both target Node 24.
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python deps (runtime + dev group)
        run: uv sync --group dev

      - name: Install Node deps
        run: npm ci

      - name: ruff check
        run: uvx ruff check

      - name: ruff format --check
        run: uvx ruff format --check

      - name: pyrefly check
        run: uvx pyrefly check

      - name: TypeScript type-check
        run: npm run type-check

      - name: Vitest (frontend unit tests)
        run: npm test

      - name: markdownlint
        run: npx --yes markdownlint-cli README.md QUICKSTART.md INSTALLATION.md APP_STRUCTURE.md docs/FRAPPEFORGE.md

      - name: Strict JSON validity
        run: |
          python - <<'PY'
          import json, glob, sys
          files = sorted(glob.glob('frappe_ai/**/*.json', recursive=True) + ['package.json', 'tsconfig.json', '.markdownlint.json'])
          failed = []
          for f in files:
              try:
                  json.load(open(f))
                  print(f'OK  {f}')
              except Exception as e:
                  print(f'FAIL  {f}: {e}')
                  failed.append(f)
          sys.exit(1 if failed else 0)
          PY

  # ──────────────────────────────────────────────────────────────────────
  # Tier 2a — the test suite, on the SNE bench. ~5–8 min. The checkout is
  # mounted as the bench's copy of the app (the image's run script
  # pip-installs and registers it), installed on the ready site, and tested
  # there. No bench is built from source and no database is provisioned.
  # ──────────────────────────────────────────────────────────────────────
  test:
    name: Test on the SNE bench
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: lint

    steps:
      - uses: actions/checkout@v6

      # The runner user and the image's frappe user are both uid 1001, so the mounted
      # checkout is writable where the bench expects to write (egg-info, built assets).
      - name: Start the SNE bench with this checkout as the app
        run: |
          docker run -d --name sne -p 8000:8000 \
            -v "$GITHUB_WORKSPACE:/home/frappe/frappe-bench/apps/$APP" "$SNE_IMAGE"
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null -H 'Host: dev.localhost' http://localhost:8000/api/method/ping && exit 0
            sleep 5
          done
          echo "::error::SNE site never came up"; docker logs --tail 80 sne; exit 1

      - name: Install the app on the site
        run: docker exec -w /home/frappe/frappe-bench sne bench --site dev.localhost install-app "$APP"

      # The SNE site ships without an encryption key. Frappe generates one the first time a
      # secret is stored, but a web worker caches the site config it started with, so a key
      # born during the test run is never loaded by the worker and every API-secret decrypt
      # fails with 401. Generate it before the workers restart.
      - name: Create the site's encryption key
        run: |
          docker exec -w /home/frappe/frappe-bench sne bench --site dev.localhost execute frappe.utils.password.get_encryption_key >/dev/null
          docker exec -w /home/frappe/frappe-bench sne sh -c 'grep -q encryption_key sites/dev.localhost/site_config.json'

      # Running web and worker processes load an app when they start. A restart of the
      # container is the SNE's `bench restart`; the database and the site survive it.
      - name: Restart the bench so the web workers load the app
        run: |
          docker restart sne
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null -H 'Host: dev.localhost' http://localhost:8000/api/method/ping && exit 0
            sleep 5
          done
          echo "::error::SNE site did not come back after restart"; docker logs --tail 80 sne; exit 1

      - name: Run the test suite
        run: |
          docker exec -w /home/frappe/frappe-bench sne bench --site dev.localhost list-apps | grep -w "$APP"
          docker exec -w /home/frappe/frappe-bench sne bench --site dev.localhost set-config allow_tests true
          docker exec -w /home/frappe/frappe-bench sne bench --site dev.localhost run-tests --app "$APP"

      - name: Bench logs on failure
        if: failure()
        run: |
          docker logs --tail 200 sne || true
          docker exec -w /home/frappe/frappe-bench sne sh -c 'tail -n 200 logs/*.log' || true

  # ──────────────────────────────────────────────────────────────────────
  # Tier 2b — the package. ~3–5 min (cold: + a frappe clone and yarn install,
  # cached per month). The artifact of this job is what gets verified and
  # published; nothing downstream rebuilds anything.
  # ──────────────────────────────────────────────────────────────────────
  package:
    name: Build FPM package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    outputs:
      version: ${{ steps.version.outputs.version }}
      kind: ${{ steps.version.outputs.kind }}
      file: ${{ steps.build.outputs.file }}

    steps:
      - uses: actions/checkout@v6
        with:
          # fpm records the exact commit in the package; the snapshot version names it too.
          fetch-depth: 0

      - name: Resolve package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          app_version="$(python3 - <<'PY'
          import re
          print(re.search(r'__version__\s*=\s*"([^"]+)"', open("frappe_ai/__init__.py").read()).group(1))
          PY
          )"
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"; kind=manual
          elif [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"; kind=release
            if [ "$version" != "$app_version" ]; then
              echo "::error::tag $REF_NAME does not match frappe_ai.__version__ = $app_version; bump __init__.py first"
              exit 1
            fi
          else
            version="${app_version}-git.$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)"; kind=snapshot
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Packaging $ORG/$APP==$version ($kind)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.BENCH_PYTHON }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel
          npm install -g yarn

      - name: Obtain FPM CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          gh release download "$FPM_VERSION" --repo vyogotech/fpm \
            --pattern 'fpm-linux-amd64' --pattern 'fpm-linux-amd64.sha256' --dir "$tmp"
          ( cd "$tmp" && sha256sum -c fpm-linux-amd64.sha256 )
          mkdir -p bin
          install -m 0755 "$tmp/fpm-linux-amd64" bin/fpm
          rm -rf "$tmp"
          ./bin/fpm --version

      # A prod package must ship its desk bundles compiled, and Frappe's own esbuild is what
      # compiles them. fpm needs only a bench-shaped directory with frappe's checkout and
      # node_modules beside the app; no virtualenv, no site. Cached per frappe line and month
      # so a cold run pays the clone and yarn install at most once a month.
      #
      # The bench lives OUTSIDE the checkout: fpm stages the whole checkout into
      # <bench>/apps/frappe_ai, and a bench inside it would be copied into itself.
      - name: Locate the build bench
        id: bench
        run: |
          echo "BUILD_BENCH=$HOME/build-bench" >> "$GITHUB_ENV"
          echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore Frappe asset pipeline
        id: frappe-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BUILD_BENCH }}/apps/frappe
          key: frappe-assets-${{ env.FRAPPE_REF }}-${{ steps.bench.outputs.ym }}

      - name: Prepare Frappe asset pipeline
        if: steps.frappe-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BUILD_BENCH/apps"
          git clone --depth 1 --branch "$FRAPPE_REF" https://github.com/frappe/frappe.git "$BUILD_BENCH/apps/frappe"
          ( cd "$BUILD_BENCH/apps/frappe" && yarn install --frozen-lockfile --network-timeout 600000 )

      - name: Lay out the build bench
        run: |
          mkdir -p "$BUILD_BENCH/sites"
          echo frappe > "$BUILD_BENCH/sites/apps.txt"

      # Both architectures are vendored in full: the Vyogo pools run amd64 and arm64
      # nodes, and a bench installs the package offline, so a missing wheel is a failed
      # install, not a slow one.
      - name: Build the package
        id: build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          ./bin/fpm package . \
            --org "$ORG" --app-name "$APP" \
            --version "$VERSION" \
            --python-version "$BENCH_PYTHON" \
            --platform manylinux2014_x86_64 --platform manylinux2014_aarch64 \
            --bench-path "$BUILD_BENCH" \
            --skip-local-install --overwrite \
            --output-path dist
          set -- dist/*.fpm
          [ -f "$1" ] || { echo "::error::no .fpm produced"; exit 1; }
          echo "file=$(basename "$1")" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpm-package
          path: dist/*.fpm
          if-no-files-found: error
          retention-days: 14

  # ──────────────────────────────────────────────────────────────────────
  # Tier 3 — the package in a real bench. ~3–5 min. `fpm install` puts the
  # package into a fresh SNE bench exactly as a pool would, offline from its
  # vendored wheels, and the site must then list the app and serve its
  # compiled bundle. A package that fails here never reaches the registry.
  # (A prod package carries no test modules, so the suite is `test`'s job.)
  # ──────────────────────────────────────────────────────────────────────
  verify:
    name: Install the package into SNE
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: package

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: fpm-package
          path: dist

      - name: Obtain FPM CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          gh release download "$FPM_VERSION" --repo vyogotech/fpm \
            --pattern 'fpm-linux-amd64' --pattern 'fpm-linux-amd64.sha256' --dir "$tmp"
          ( cd "$tmp" && sha256sum -c fpm-linux-amd64.sha256 )
          mkdir -p bin
          install -m 0755 "$tmp/fpm-linux-amd64" bin/fpm
          rm -rf "$tmp"

      - name: Start the SNE bench
        run: |
          docker run -d --name sne -p 8000:8000 "$SNE_IMAGE"
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null -H 'Host: dev.localhost' http://localhost:8000/api/method/ping && exit 0
            sleep 5
          done
          echo "::error::SNE site never came up"; docker logs --tail 80 sne; exit 1

      - name: fpm install
        env:
          FILE: ${{ needs.package.outputs.file }}
        run: |
          docker cp bin/fpm sne:/tmp/fpm
          docker cp "dist/$FILE" sne:/tmp/package.fpm
          docker exec -u 0 sne chown 1001 /tmp/fpm /tmp/package.fpm
          docker exec -w /home/frappe/frappe-bench sne /tmp/fpm install /tmp/package.fpm \
            --bench-path /home/frappe/frappe-bench --site dev.localhost --skip-required-apps-check

      # fpm says it after every install: running web and worker processes load an app
      # when they start. A restart of the container is the SNE's `bench restart`; the
      # database and the site survive it, and its run script re-registers the app.
      - name: Restart the bench so the web workers load the app
        run: |
          docker restart sne
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null -H 'Host: dev.localhost' http://localhost:8000/api/method/ping && exit 0
            sleep 5
          done
          echo "::error::SNE site did not come back after restart"; docker logs --tail 80 sne; exit 1

      - name: The app is installed and its bundle is served
        run: |
          docker exec -w /home/frappe/frappe-bench sne bench --site dev.localhost list-apps | grep -w "$APP"
          docker exec -w /home/frappe/frappe-bench sne sh -c "ls sites/assets/$APP/dist/js/*.bundle.*.js"
          docker exec -w /home/frappe/frappe-bench sne sh -c "grep -q '\"$APP.bundle.js\"' sites/assets/assets.json"
          bundle="$(docker exec -w /home/frappe/frappe-bench sne python3 -c "import json;print(json.load(open('sites/assets/assets.json'))['$APP.bundle.js'])")"
          curl -fsS -o /dev/null -H 'Host: dev.localhost' "http://localhost:8000$bundle"

      - name: Bench logs on failure
        if: failure()
        run: |
          docker logs --tail 200 sne || true
          docker exec -w /home/frappe/frappe-bench sne sh -c 'tail -n 200 logs/*.log' || true

  # ──────────────────────────────────────────────────────────────────────
  # Tier 4 — publish. Only a verified package, and only from main, a tag,
  # or an explicit dispatch.
  # ──────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to the FPM registry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [package, verify, test]
    if: >-
      github.ref_type == 'tag' ||
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: fpm-package
          path: dist

      - name: Obtain FPM CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          gh release download "$FPM_VERSION" --repo vyogotech/fpm \
            --pattern 'fpm-linux-amd64' --pattern 'fpm-linux-amd64.sha256' --dir "$tmp"
          ( cd "$tmp" && sha256sum -c fpm-linux-amd64.sha256 )
          mkdir -p bin
          install -m 0755 "$tmp/fpm-linux-amd64" bin/fpm
          rm -rf "$tmp"

      # GHCR first: it needs only the pipeline token, so a missing Vyogo credential never
      # withholds the package entirely. The Vyogo registry then gets the same file, and the
      # job fails if its secrets are not configured rather than quietly publishing to one
      # registry out of two.
      - name: Publish to GHCR (OCI)
        env:
          VERSION: ${{ needs.package.outputs.version }}
          FILE: ${{ needs.package.outputs.file }}
          # fpm reads the password for repository <name> from FPM_REPO_<NAME>_PASSWORD.
          FPM_REPO_GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./bin/fpm repo add ghcr "$FPM_OCI_REPOSITORY" --type oci --username "${{ github.actor }}"
          ./bin/fpm publish --from-file "dist/$FILE" --repo ghcr
          ./bin/fpm exists "$ORG/$APP==$VERSION" --remote

      - name: Publish to the Vyogo FPM registry (HTTP)
        env:
          VERSION: ${{ needs.package.outputs.version }}
          FILE: ${{ needs.package.outputs.file }}
          FPM_HTTP_USER: ${{ secrets.FPM_REGISTRY_USERNAME }}
          FPM_REPO_VYOGO_PASSWORD: ${{ secrets.FPM_REGISTRY_PASSWORD }}
        run: |
          if [ -z "$FPM_HTTP_USER" ] || [ -z "$FPM_REPO_VYOGO_PASSWORD" ]; then
            echo "::error::$FPM_HTTP_REGISTRY needs the FPM_REGISTRY_USERNAME and FPM_REGISTRY_PASSWORD repository secrets (the values the vyogotech/fpm mirror workflow uses). GHCR has the package; this registry does not."
            exit 1
          fi
          ./bin/fpm repo add vyogo "$FPM_HTTP_REGISTRY" --type http --username "$FPM_HTTP_USER"
          ./bin/fpm publish --from-file "dist/$FILE" --repo vyogo
          # exists --remote reports the first repository that answers; ask this one directly.
          curl -fsS -u "$FPM_HTTP_USER:$FPM_REPO_VYOGO_PASSWORD" \
            "$FPM_HTTP_REGISTRY/metadata/$ORG/$APP/package-metadata.json" | grep -q "\"$VERSION\""
          echo "$ORG/$APP==$VERSION is in $FPM_HTTP_REGISTRY"

      - name: Summary
        env:
          VERSION: ${{ needs.package.outputs.version }}
          KIND: ${{ needs.package.outputs.kind }}
        run: |
          {
            echo "### Published \`$ORG/$APP==$VERSION\` ($KIND)"
            echo
            echo "- \`$FPM_HTTP_REGISTRY\`"
            echo "- \`$FPM_OCI_REPOSITORY\`"
            echo
            echo '```bash'
            echo "fpm repo add vyogo $FPM_HTTP_REGISTRY --username <user>   # or: fpm repo add ghcr $FPM_OCI_REPOSITORY --type oci"
            echo "fpm install $ORG/$APP==$VERSION --bench-path <bench> --site <site>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
