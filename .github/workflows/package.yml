name: Package

# Builds the frappe_ai FPM package — compiled desk assets, vendored Python
# dependencies — proves it installs into a real bench, and publishes it as an
# OCI artifact to the FPM registry on GHCR.
#
#   tag v<X.Y.Z>    release   vyogotech/frappe_ai==X.Y.Z   (must equal frappe_ai.__version__)
#   push to main    snapshot  vyogotech/frappe_ai==X.Y.Z-git.<date>.<sha>   (a prerelease, never `latest`)
#   dispatch        either of the above; `publish: false` builds and uploads the .fpm only
#
# Install from the registry:
#   fpm repo add ghcr ghcr.io/vyogotech/fpm --type oci
#   fpm install vyogotech/frappe_ai --bench-path <bench> --site <site>

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the registry. Off, the package is only uploaded as a workflow artifact.
        type: boolean
        default: true
      version:
        description: Version to package. Default is derived from the ref.
        type: string
        default: ''

# GITHUB_TOKEN is the pipeline's own credential: `packages: write` lets it push to
# ghcr.io/<org>/..., with no PAT to provision. Set the FPM_REGISTRY_PASSWORD secret
# (and FPM_REGISTRY_USERNAME variable) only when the registry lives elsewhere.
permissions:
  contents: read
  packages: write

concurrency:
  # Publishing is not cancellable: two snapshots in flight simply queue.
  group: package-${{ github.ref }}
  cancel-in-progress: false

env:
  FPM_VERSION: v4.6.0
  # The frappe whose esbuild compiles this app's desk bundles. Must match the bench line
  # the package targets; the Vyogo Cloud pools and the SNE image are v16.
  FRAPPE_REF: version-16
  # Python of the destination bench. Frappe v16 (16.18+) runs on 3.14.
  BENCH_PYTHON: '3.14'
  # Where the package goes: <registry>/vyogotech/frappe_ai. The default is the shared
  # Vyogo FPM registry that `fpm mirror` fills with frappe and erpnext.
  FPM_OCI_REPOSITORY: ${{ vars.FPM_OCI_REPOSITORY || 'ghcr.io/vyogotech/fpm' }}
  ORG: vyogotech
  APP: frappe_ai

jobs:
  package:
    name: Build, verify & publish
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          # fpm records the exact commit in the package; the snapshot version names it too.
          fetch-depth: 0

      - name: Resolve package version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          app_version="$(python3 - <<'PY'
          import re
          print(re.search(r'__version__\s*=\s*"([^"]+)"', open("frappe_ai/__init__.py").read()).group(1))
          PY
          )"
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"; kind=manual
          elif [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"; kind=release
            if [ "$version" != "$app_version" ]; then
              echo "::error::tag $REF_NAME does not match frappe_ai.__version__ = $app_version; bump __init__.py first"
              exit 1
            fi
          else
            version="${app_version}-git.$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)"; kind=snapshot
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Packaging $ORG/$APP==$version ($kind)"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.BENCH_PYTHON }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Frappe v16 frontend declares engines.node >= 24.
          node-version: '24'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip wheel
          npm install -g yarn

      # The CLI is a released, checksummed binary from the public vyogotech/fpm repo.
      - name: Obtain FPM CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          gh release download "$FPM_VERSION" --repo vyogotech/fpm \
            --pattern 'fpm-linux-amd64' --pattern 'fpm-linux-amd64.sha256' --dir "$tmp"
          ( cd "$tmp" && sha256sum -c fpm-linux-amd64.sha256 )
          mkdir -p bin
          install -m 0755 "$tmp/fpm-linux-amd64" bin/fpm
          rm -rf "$tmp"
          ./bin/fpm --version

      # A prod package must ship its desk bundles compiled, and Frappe's own esbuild is what
      # compiles them. fpm needs only a bench-shaped directory with frappe's checkout and
      # node_modules beside the app; no virtualenv, no site. Cached per frappe line and month
      # so a cold run pays the clone and yarn install at most once a month.
      - name: Cache key
        id: month
        run: echo "ym=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore Frappe asset pipeline
        id: frappe-cache
        uses: actions/cache@v4
        with:
          path: build-bench/apps/frappe
          key: frappe-assets-${{ env.FRAPPE_REF }}-${{ steps.month.outputs.ym }}

      - name: Prepare Frappe asset pipeline
        if: steps.frappe-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build-bench/apps
          git clone --depth 1 --branch "$FRAPPE_REF" https://github.com/frappe/frappe.git build-bench/apps/frappe
          ( cd build-bench/apps/frappe && yarn install --frozen-lockfile --network-timeout 600000 )

      - name: Lay out the build bench
        run: |
          mkdir -p build-bench/sites
          echo frappe > build-bench/sites/apps.txt

      # Both architectures are vendored in full: the Vyogo pools run amd64 and arm64
      # nodes, and a bench installs the package offline, so a missing wheel is a failed
      # install, not a slow one.
      - name: Build the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          ./bin/fpm package . \
            --org "$ORG" --app-name "$APP" \
            --version "$VERSION" \
            --python-version "$BENCH_PYTHON" \
            --platform manylinux2014_x86_64 --platform manylinux2014_aarch64 \
            --bench-path "$PWD/build-bench" \
            --skip-local-install --overwrite \
            --output-path dist
          set -- dist/*.fpm
          [ -f "$1" ] || { echo "::error::no .fpm produced"; exit 1; }
          echo "file=$1" >> "$GITHUB_ENV"
          ls -la dist

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-${{ steps.version.outputs.version }}.fpm
          path: dist/*.fpm
          if-no-files-found: error

      # Publishing proves an artifact exists; installing it proves it works. The package
      # goes into the same SNE image the Vyogo pools run, through fpm itself, and the
      # compiled bundle must be where Frappe serves it from.
      - name: Verify install in the SNE image
        timeout-minutes: 15
        run: |
          docker run -d --name sne -p 8000:8000 docker.io/vyogo/erpnext:sne-version-16
          for i in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:8000/api/method/ping && break
            sleep 5
            [ "$i" = 60 ] && { echo "::error::SNE site never came up"; docker logs --tail 80 sne; exit 1; }
          done
          docker cp bin/fpm sne:/tmp/fpm
          docker cp "$file" sne:/tmp/package.fpm
          docker exec -u 0 sne chown 1001 /tmp/fpm /tmp/package.fpm
          docker exec -w /home/frappe/frappe-bench sne /tmp/fpm install /tmp/package.fpm \
            --bench-path /home/frappe/frappe-bench --site dev.localhost --skip-required-apps-check
          docker exec -w /home/frappe/frappe-bench sne bench --site dev.localhost list-apps | grep -w "$APP"
          docker exec -w /home/frappe/frappe-bench sne sh -c "ls sites/assets/$APP/dist/js/*.bundle.*.js"
          docker exec -w /home/frappe/frappe-bench sne bench --site dev.localhost set-config allow_tests true
          docker exec -w /home/frappe/frappe-bench sne bench --site dev.localhost run-tests --app "$APP"
          docker rm -f sne

      - name: Publish to the FPM registry
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_USER: ${{ vars.FPM_REGISTRY_USERNAME || github.actor }}
          # fpm reads the password for repository <name> from FPM_REPO_<NAME>_PASSWORD.
          FPM_REPO_GHCR_PASSWORD: ${{ secrets.FPM_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
        run: |
          ./bin/fpm repo add ghcr "$FPM_OCI_REPOSITORY" --type oci --username "$REGISTRY_USER"
          ./bin/fpm publish --from-file "$file" --repo ghcr
          ./bin/fpm exists "$ORG/$APP==$VERSION" --remote
          {
            echo "### Published \`$ORG/$APP==$VERSION\` (${{ steps.version.outputs.kind }})"
            echo
            echo "Registry: \`$FPM_OCI_REPOSITORY\`"
            echo
            echo '```bash'
            echo "fpm repo add ghcr $FPM_OCI_REPOSITORY --type oci"
            echo "fpm install $ORG/$APP==$VERSION --bench-path <bench> --site <site>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
