# Local test site for frappe_ai: the SNE image (bench + MariaDB + Redis in one container)
# with this repository mounted as an app. Used for `bench run-tests` and as the stand-in
# "live site" that FrappeForge connects to in end-to-end checks.
#
#   podman compose up -d                     # first start takes a few minutes
#   podman compose exec frappe bash -lc 'bench --site dev.localhost install-app frappe_ai'
#   podman compose exec frappe bash -lc 'bench --site dev.localhost run-tests --app frappe_ai'
#   # test runs create many agent users; Frappe allows 60 new users an hour per site by default:
#   podman compose exec frappe bash -lc 'bench --site dev.localhost set-config throttle_user_limit 100000 --parse'
#
# Desk: http://localhost:${FRAPPE_AI_PORT:-8010} (Administrator / admin).
services:
  frappe:
    image: docker.io/vyogo/erpnext:sne-version-16
    ports:
      - "${FRAPPE_AI_PORT:-8010}:8000"
    environment:
      DEVELOPER_MODE: "1"
    volumes:
      - .:/home/frappe/frappe-bench/apps/frappe_ai:z
      - sites:/home/frappe/frappe-bench/sites
      # the SNE image keeps MariaDB in the container; persist it with the sites, or a recreated
      # container meets a site_config whose database user no longer exists
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/api/method/ping"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

volumes:
  sites:
  mariadb:
